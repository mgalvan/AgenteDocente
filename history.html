<!DOCTYPE html>
<html lang="it"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>Agente Docente | Cronologia</title><style>body{margin:0;color:#1d2939;font-family:Segoe UI,sans-serif;background:linear-gradient(135deg,#f5fbfa,#fffdf8);}.shell{max-width:1250px;margin:auto;padding:36px 28px}.entry{background:#fff;border:1px solid #d9e2ea;border-radius:9px;padding:15px;margin-top:14px}.toolbar{display:flex;justify-content:space-between;border-bottom:1px solid #d9e2ea;padding-bottom:17px}.panel{background:#fff;padding:25px;border-radius:14px;box-shadow:0 16px 40px #28404c1a}button{border:0;border-radius:8px;padding:9px 12px;margin:3px;font-weight:700;cursor:pointer}.secondary{background:#e6f5f2;color:#05645f}.danger{background:#fff0ed;color:#b54732}.preview,.response{white-space:pre-wrap;max-height:240px;overflow:auto;background:#f8fafb;padding:10px;margin:10px 0;font:12px/1.45 Consolas,monospace}.meta{color:#667085;font-size:12px}.artifact-card{border-top:1px solid #edf1f3;padding:10px 0}.empty{color:#667085;padding:30px;text-align:center}button:disabled{opacity:.5;cursor:wait}</style>
<link rel="stylesheet" href="/theme.css?v=2"></head><body><main class="shell"><header><h1>Cronologia richieste</h1><button class="secondary" onclick="location.href='/'">Torna al compositore</button></header><section class="panel"><div class="toolbar"><div><h2>Prompt salvati</h2><p>Le risposte e gli artefatti sono conservati sul server.</p></div><div><button class="danger" id="deleteAll">Cancella tutto</button><button class="secondary" id="refresh">Aggiorna</button></div></div><label>Motore PDF <select id="pdfEngine"><option value="standard">Attuale (ReportLab/Matplotlib)</option><option value="typst">Typst/Lilaq (sperimentale)</option></select></label><p>La scelta riguarda solo il PDF. DOCX e PPTX usano il motore attuale.</p><div id="entries"></div></section></main><script>
const entries=document.getElementById('entries');
function safe(v){return String(v??'').replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]));}
async function load(){const data=await (await fetch('/api/history',{cache:'no-store'})).json();entries.innerHTML='';if(!data.length){entries.innerHTML='<div class="empty">Nessun prompt salvato.</div>';return;}data.slice().reverse().forEach(item=>{const box=document.createElement('article');box.className='entry';box.innerHTML=`<div><strong>${safe(item.chatbot)}</strong><div class="meta">${safe(new Date(item.requested_at).toLocaleString('it-IT'))}</div><button class="secondary reload-prompt" type="button">Ricarica prompt</button><button class="danger">Elimina</button></div><div class="meta">Prompt</div><div class="preview">${safe(item.prompt)}</div><div class="meta">Risposta AI</div><div class="response">${safe(item.response||'Risposta non disponibile')}</div><div class="meta">${safe((item.validation_problems||[]).join("; "))}</div><div class="meta">Artefatti</div><div class="artifact-list"></div>`;box.querySelector('.reload-prompt').onclick=()=>{location.href='/?reload='+encodeURIComponent(item.id);};box.querySelector('.danger').onclick=async()=>{if(confirm('Cancellare questa richiesta?')){await fetch('/api/history/delete',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({id:item.id})});load();}};const list=box.querySelector('.artifact-list');(item.artifacts||[]).forEach((artifact,i)=>{const card=document.createElement('div');card.className='artifact-card';card.innerHTML=`<strong>${safe(artifact.title||artifact.artifact_type||'Artefatto '+(i+1))}</strong>`;(artifact.formats || ['pdf','pptx','docx']).forEach(format=>{const b=document.createElement('button');b.className='secondary';b.textContent=artifact.history_id ? 'Rigenera regolamento DOCX' : 'Render '+format.toUpperCase();b.onclick=()=>downloadArtifact(artifact,item.response,format,b);card.appendChild(b);});list.appendChild(card);});entries.appendChild(box);});}
document.getElementById('refresh').onclick=load;document.getElementById('deleteAll').onclick=async()=>{if(confirm('Cancellare tutta la cronologia?')){await fetch('/api/history/delete',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({all:true})});load();}};load();</script><script src="/render-ui.js"></script></body></html>
