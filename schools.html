<!DOCTYPE html>
<html lang="it"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>Agente Docente | Scuola</title><style>body{margin:0;color:#1d2939;font-family:Segoe UI,sans-serif;background:#f5faf9}.shell{max-width:1000px;margin:auto;padding:36px 28px}.panel{background:#fff;border:1px solid #d9e2ea;border-radius:10px;padding:24px}table{width:100%;border-collapse:collapse;margin:18px 0}th,td{padding:9px;text-align:left;border-bottom:1px solid #d9e2ea}th{background:#eef4f3}input{width:100%;box-sizing:border-box;padding:9px;border:1px solid #cdd8df;border-radius:6px}button{border:0;border-radius:7px;padding:10px 13px;margin-right:8px;font-weight:700;cursor:pointer}.primary{background:#087f78;color:white}.secondary{background:#e6f5f2;color:#05645f}.danger{background:#fff0ed;color:#b54732}#status{color:#05645f;font-size:13px}</style>
<link rel="stylesheet" href="/theme.css?v=2"></head><body><main class="shell"><h1>Tabella Scuola</h1><p>Gestisci tipi di scuola e indirizzi disponibili nel compositore.</p><section class="panel"><button class="secondary" onclick="location.href='/'">Torna al compositore</button><button class="secondary" id="add">Aggiungi riga</button><button class="primary" id="save">Salva tabella</button><span id="status"></span><table><thead><tr><th>Tipo scuola</th><th>Indirizzo</th><th>Operazione</th></tr></thead><tbody id="rows"></tbody></table></section></main><script>const rows=document.getElementById('rows');function addRow(row={}){const tr=document.createElement('tr');tr.innerHTML=`<td><input value="${row.TipoScuola||''}"></td><td><input value="${row.Indirizzo||''}"></td><td><button class="danger">Elimina</button></td>`;tr.querySelector('button').onclick=()=>tr.remove();rows.appendChild(tr)}async function load(){const data=await (await fetch('/api/schools',{cache:'no-store'})).json();data.forEach(addRow);document.getElementById('status').textContent=data.length+' righe caricate'}async function save(){const data=[...rows.querySelectorAll('tr')].map(tr=>{const inputs=tr.querySelectorAll('input');return {TipoScuola:inputs[0].value.trim(),Indirizzo:inputs[1].value.trim()}});const response=await fetch('/api/schools',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(data)});const result=await response.json();document.getElementById('status').textContent=response.ok?result.rows.length+' righe salvate':result.error}document.getElementById('add').onclick=()=>addRow();document.getElementById('save').onclick=save;load()</script></body></html>
